name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ -d "KenoStatsAndroid" ]; then
            cd KenoStatsAndroid
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.6.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          if [ -d "KenoStatsAndroid" ]; then
            cd KenoStatsAndroid
          fi
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No debug APK found."
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          mkdir -p output
          cp "$APK_PATH" output/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: output/app-debug.apk
          retention-days: 30
